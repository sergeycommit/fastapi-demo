apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-demo-deployment
  namespace: telegram-bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-demo
  template:
    metadata:
      labels:
        app: fastapi-demo
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: bot
        image: sergeyilin/fastapi:latest
        env:
        - name: OR_API_KEY
          valueFrom:
            secretKeyRef:
              name: fastapi-demo-secret
              key: OR_API_KEY
        - name: USER
          valueFrom:
            secretKeyRef:
              name: fastapi-demo-secret
              key: USER
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: fastapi-demo-secret
              key: PASSWORD
        - name: DB_HOST
          value: "postgres-service.telegram-bots.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: GEMINI_DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
